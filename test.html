<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<body style="font-family:sans-serif;padding:16px;max-width:460px">
<h3>Rol testi</h3>
<input id="n" placeholder="takma ad" style="width:100%;padding:10px;margin:6px 0">
<input id="p" type="password" placeholder="şifre" style="width:100%;padding:10px;margin:6px 0">
<button id="b" style="padding:10px">Giriş yap ve rolleri kontrol et</button>
<pre id="o" style="white-space:pre-wrap;background:#eee;padding:10px;margin-top:12px;font-size:12px">Sonuç burada görünecek</pre>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCLN1h8gJbxgq8e5VpOHep3NKlmWmMXEbE",authDomain:"asure-f9093.firebaseapp.com",projectId:"asure-f9093",appId:"1:949621118268:web:9417f8c18e409c24b27a39"});
const auth=getAuth(app),db=getFirestore(app);
const o=document.getElementById("o");
document.getElementById("b").onclick=async()=>{
  const m=document.getElementById("n").value.trim().toLowerCase()+"@asure.users";
  o.textContent="Deneniyor...";
  try{
    const c=await signInWithEmailAndPassword(auth,m,document.getElementById("p").value);
    const uid=c.user.uid;
    let t="GİRİŞ BAŞARILI\nUID: "+uid+"\n\n";
    try{
      const s=await getDocs(collection(db,"roles"));
      t+="roles koleksiyonunda "+s.size+" belge var:\n";
      s.forEach(d=>{t+=" - "+d.id+" => "+JSON.stringify(d.data())+(d.id===uid?"   <== EŞLEŞTİ":"")+"\n"});
    }catch(e){t+="roles OKUNAMADI: "+e.code}
    o.textContent=t;
  }catch(e){o.textContent="GİRİŞ HATASI: "+e.code}
};
    </script>
